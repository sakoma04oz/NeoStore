name: Build NeoBattle3D Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NeoBattle3D/**"
      - ".github/workflows/neobattle3d-android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Export Android APK with Godot
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.3/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.3/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./NeoBattle3D
          relative_export_path: ./NeoBattle3D/build
          export_debug: true
          presets_to_export: Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoBattle3D-Android-APK
          path: NeoBattle3D/build/*.apk
          if-no-files-found: error
          retention-days: 14
